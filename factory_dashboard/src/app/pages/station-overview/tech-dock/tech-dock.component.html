<mat-form-field appearance="fill">
  <select
    matNativeControl
    [(ngModel)]="selectedDocument"
    (change)="onDocumentChange($event)"
    [disabled]="activeTab === 'UnK'"
  >
    <option value="" hidden selected>Тех. документация</option>
    <option *ngFor="let doc of filteredDocuments" [value]="doc.id">
      {{ doc.name }}
    </option>
  </select>
</mat-form-field>
