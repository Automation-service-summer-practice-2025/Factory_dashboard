<img
  src="assets/FasctoryMapFigma.svg"
  usemap="#image-map"
  (mousemove)="onMouseMove($event)"
  class="responsive-image"
/>

<map name="image-map">
  <area
    *ngFor="let station of stations"
    [attr.href]="'station/' + station.id"
    [attr.coords]="station.coordinates"
    [attr.shape]="station.shape"
    (mouseenter)="onAreaHover(station, $event)"
    (mouseleave)="onAreaLeave()"
  />
</map>

<div
  *ngIf="activeTooltip"
  class="custom-tooltip"
  [style.left.px]="tooltipPosition.x"
  [style.top.px]="tooltipPosition.y"
>
  <h4>{{ activeTooltip.station_name }}</h4>
  <p>{{ activeTooltip.description }}</p>
</div>
